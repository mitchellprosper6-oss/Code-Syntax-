<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODE FOUNDRY — Python · C++ · C</title>
<style>
/* ================= BLUEPRINT DESIGN SYSTEM ================= */
:root{
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"]{
  --bg:#0C121B; --bg2:#101826; --panel:#151F2E; --panel2:#1A2536;
  --line:#26374F; --line2:#2F425D;
  --ink:#D9E2EE; --muted:#8CA0BA; --faint:#5D7189;
  --blue:#7FB3E3; --blue-dim:#4A78A8;
  --ochre:#D9A441; --ochre-ink:#1A1206;
  --green:#7CC08A; --red:#E08A8A;
  --code-bg:#0A0F17;
  --kw:#7FB3E3; --str:#D9A441; --com:#5D7189; --num:#7CC08A; --fn:#C7A8E8;
  --grid: rgba(127,179,227,.045);
  --shadow: 0 10px 30px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#E9EDF1; --bg2:#E1E7ED; --panel:#F5F7F9; --panel2:#EDF1F5;
  --line:#B9C7D6; --line2:#A6B7C9;
  --ink:#1D2A3B; --muted:#4E6076; --faint:#7C8DA1;
  --blue:#2E6398; --blue-dim:#5F87AD;
  --ochre:#A8730F; --ochre-ink:#FFF7E6;
  --green:#2F7A42; --red:#A83A3A;
  --code-bg:#F0F3F6;
  --kw:#2E6398; --str:#A8730F; --com:#7C8DA1; --num:#2F7A42; --fn:#6E3FA0;
  --grid: rgba(46,99,152,.06);
  --shadow: 0 8px 24px rgba(29,42,59,.12);
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--ink);
  font-size:15.5px; line-height:1.65;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important}
}

/* ---------- layout shell ---------- */
#app{display:grid; grid-template-columns:288px 1fr; min-height:100vh}
#sidebar{
  background:var(--bg2); border-right:1px solid var(--line);
  height:100vh; position:sticky; top:0; display:flex; flex-direction:column;
}
#main{min-width:0; padding:28px clamp(16px,4vw,56px) 80px}

/* ---------- masthead ---------- */
.masthead{padding:18px 18px 14px; border-bottom:1px solid var(--line)}
.masthead .mark{display:flex; align-items:baseline; gap:8px}
.masthead .mark b{font-family:var(--font-mono); font-size:17px; letter-spacing:.14em; color:var(--ink)}
.masthead .mark span{font-family:var(--font-mono); font-size:10px; color:var(--ochre); letter-spacing:.2em}
.masthead .sub{font-family:var(--font-mono); font-size:10px; color:var(--muted); letter-spacing:.12em; margin-top:3px}
.mast-row{display:flex; gap:8px; margin-top:12px}
.mast-row button{flex:1}

/* ---------- controls ---------- */
button, .btn{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
  background:var(--panel); color:var(--muted); border:1px solid var(--line);
  padding:7px 10px; cursor:pointer; border-radius:3px;
  transition:border-color .15s, color .15s, background .15s;
}
button:hover, .btn:hover{border-color:var(--blue-dim); color:var(--ink)}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--ochre); outline-offset:2px;
}
button.primary{background:var(--blue-dim); border-color:var(--blue-dim); color:#fff}
html[data-theme="light"] button.primary{background:var(--blue); border-color:var(--blue)}
button.primary:hover{filter:brightness(1.1); color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.4; cursor:not-allowed}

#search{
  width:100%; font-family:var(--font-mono); font-size:12px;
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  padding:8px 10px; border-radius:3px;
}
#search::placeholder{color:var(--faint)}
.search-wrap{padding:12px 14px; border-bottom:1px solid var(--line)}

/* ---------- nav tree ---------- */
#nav{overflow-y:auto; flex:1; padding:10px 0 24px; scrollbar-width:thin}
.nav-sec{margin-top:14px}
.nav-sec-title{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.18em;
  color:var(--faint); padding:4px 18px; display:flex; justify-content:space-between;
}
.nav-sec-title .cnt{color:var(--faint)}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:none; border-left:2px solid transparent; border-radius:0;
  padding:7px 16px; font-family:var(--font-body); font-size:13.5px; letter-spacing:0;
  color:var(--muted); cursor:pointer;
}
.nav-item:hover{color:var(--ink); background:var(--panel)}
.nav-item.active{color:var(--ink); background:var(--panel); border-left-color:var(--ochre)}
.nav-item .st{font-family:var(--font-mono); font-size:10px; width:22px; flex:none; color:var(--faint)}
.nav-item .st.done{color:var(--green)}
.nav-item .st.lock{color:var(--faint)}
.nav-item .bkm{margin-left:auto; color:var(--ochre); font-size:11px}
.nav-item.locked{opacity:.55}
.nav-util{border-top:1px solid var(--line); padding:8px 0}

/* ---------- sheet (lesson page) ---------- */
.sheet{
  max-width:880px; margin:0 auto; background:var(--panel);
  border:1px solid var(--line2); box-shadow:var(--shadow); border-radius:4px;
  animation:sheetIn .3s ease both;
}
@keyframes sheetIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.titleblock{
  display:grid; grid-template-columns:1fr auto auto; border-bottom:1px solid var(--line2);
}
.titleblock > div{padding:14px 18px}
.titleblock > div + div{border-left:1px solid var(--line2)}
.tb-eyebrow{font-family:var(--font-mono); font-size:10px; letter-spacing:.2em; color:var(--blue); margin-bottom:4px}
.tb-title{font-size:24px; font-weight:750; letter-spacing:-.015em; line-height:1.2}
.tb-cell{font-family:var(--font-mono); font-size:10px; color:var(--muted); letter-spacing:.08em; align-self:center}
.tb-cell b{display:block; font-size:13px; color:var(--ink); margin-top:2px; letter-spacing:.04em}
.stamp{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.22em;
  border:2px solid var(--ochre); color:var(--ochre); padding:5px 10px; border-radius:2px;
  transform:rotate(-4deg); display:inline-block; user-select:none;
}
.stamp.pass{border-color:var(--green); color:var(--green)}
.stamp.pop{animation:stampIn .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{from{transform:rotate(-14deg) scale(1.6); opacity:0} to{transform:rotate(-4deg) scale(1); opacity:1}}

.sheet-tabs{display:flex; border-bottom:1px solid var(--line2); background:var(--panel2)}
.sheet-tabs button{
  border:none; border-radius:0; background:none; padding:11px 18px;
  border-bottom:2px solid transparent;
}
.sheet-tabs button.on{color:var(--ink); border-bottom-color:var(--ochre); background:var(--panel)}
.sheet-body{padding:26px clamp(18px,4vw,42px) 40px}

/* ---------- content typography ---------- */
.sheet-body h2{font-size:19px; font-weight:700; margin:34px 0 10px; letter-spacing:-.01em}
.sheet-body h2::before{content:"— "; color:var(--ochre)}
.sheet-body h3{font-size:15.5px; font-weight:700; margin:24px 0 8px}
.sheet-body p{margin:0 0 14px; color:var(--ink)}
.sheet-body p.lede{font-size:17px; color:var(--muted); margin-bottom:22px}
.sheet-body ul,.sheet-body ol{margin:0 0 16px 22px}
.sheet-body li{margin-bottom:6px}
.sheet-body strong{color:var(--ink)}
.sheet-body em{color:var(--muted)}
.sheet-body code{
  font-family:var(--font-mono); font-size:.88em; background:var(--code-bg);
  border:1px solid var(--line); padding:1px 5px; border-radius:3px; color:var(--blue);
}
html[data-theme="light"] .sheet-body code{color:var(--blue)}

.callout{
  border:1px solid var(--line2); border-left:3px solid var(--blue-dim);
  background:var(--panel2); padding:12px 16px; margin:0 0 16px; border-radius:0 3px 3px 0;
}
.callout .tag{font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; color:var(--blue); display:block; margin-bottom:4px}
.callout.warn{border-left-color:var(--ochre)}
.callout.warn .tag{color:var(--ochre)}
.callout p:last-child{margin-bottom:0}

table.spec{width:100%; border-collapse:collapse; margin:0 0 18px; font-size:13.5px}
table.spec th{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:var(--muted);
  text-align:left; border-bottom:1px solid var(--line2); padding:6px 10px;
}
table.spec td{border-bottom:1px solid var(--line); padding:7px 10px; vertical-align:top}
table.spec code{white-space:nowrap}

/* ---------- code blocks ---------- */
.codeblock{border:1px solid var(--line2); border-radius:4px; margin:0 0 18px; overflow:hidden}
.codehead{
  display:flex; align-items:center; gap:2px; background:var(--panel2);
  border-bottom:1px solid var(--line2); padding:0 6px;
}
.codehead .langtab{
  border:none; border-radius:0; background:none; padding:8px 12px; font-size:10.5px;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.codehead .langtab.on{color:var(--ochre); border-bottom-color:var(--ochre)}
.codehead .label{font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; color:var(--faint); padding:8px 12px}
.codehead .copy{margin-left:auto; border:none; background:none; padding:6px 8px}
.codehead .copy:hover{color:var(--ochre)}
.codeblock pre{
  background:var(--code-bg); padding:14px 16px; overflow-x:auto;
  font-family:var(--font-mono); font-size:12.8px; line-height:1.6; tab-size:4;
}
.codeblock pre code{background:none; border:none; padding:0; color:var(--ink); font-size:inherit}
.tok-kw{color:var(--kw)} .tok-str{color:var(--str)} .tok-com{color:var(--com); font-style:italic}
.tok-num{color:var(--num)} .tok-fn{color:var(--fn)} .tok-pre{color:var(--ochre)}
.codepane{display:none} .codepane.on{display:block}

/* ---------- quiz ---------- */
.quiz-q{border:1px solid var(--line2); border-radius:4px; margin-bottom:16px; background:var(--panel2)}
.quiz-q .qh{padding:12px 16px 4px; font-weight:650}
.quiz-q .qh .qn{font-family:var(--font-mono); font-size:10px; color:var(--ochre); letter-spacing:.16em; display:block; margin-bottom:4px}
.quiz-opts{padding:8px 16px 14px; display:grid; gap:7px}
.quiz-opt{
  text-align:left; font-family:var(--font-body); font-size:13.5px; letter-spacing:0;
  padding:9px 12px; background:var(--panel); position:relative;
}
.quiz-opt.sel{border-color:var(--blue); color:var(--ink)}
.quiz-opt.right{border-color:var(--green); color:var(--green)}
.quiz-opt.wrong{border-color:var(--red); color:var(--red)}
.quiz-why{margin:0 16px 14px; font-size:13px; color:var(--muted); border-left:2px solid var(--line2); padding-left:12px; display:none}
.quiz-why.show{display:block}
.quiz-foot{display:flex; align-items:center; gap:14px; margin-top:20px}
.quiz-score{font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; color:var(--muted)}

/* ---------- challenge / notes ---------- */
details.hint{border:1px solid var(--line2); border-radius:3px; margin-bottom:10px; background:var(--panel2)}
details.hint summary{
  cursor:pointer; padding:9px 14px; font-family:var(--font-mono); font-size:11px;
  letter-spacing:.14em; color:var(--muted); user-select:none;
}
details.hint[open] summary{color:var(--ochre); border-bottom:1px solid var(--line2)}
details.hint .hint-body{padding:12px 14px}
#notes-area{
  width:100%; min-height:180px; resize:vertical; font-family:var(--font-mono); font-size:13px;
  background:var(--code-bg); color:var(--ink); border:1px solid var(--line2);
  border-radius:3px; padding:12px 14px; line-height:1.6;
}

/* ---------- dashboard ---------- */
.dash-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin:18px 0 26px}
.dash-card{border:1px solid var(--line2); background:var(--panel2); border-radius:4px; padding:16px 18px}
.dash-card .k{font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; color:var(--muted)}
.dash-card .v{font-size:30px; font-weight:750; margin-top:6px; font-variant-numeric:tabular-nums}
.dash-card .v small{font-size:14px; color:var(--faint); font-weight:500}
.progressbar{height:6px; background:var(--code-bg); border:1px solid var(--line); border-radius:3px; overflow:hidden; margin-top:10px}
.progressbar i{display:block; height:100%; background:var(--ochre); transition:width .4s ease}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.badge{border:1px solid var(--line2); border-radius:4px; padding:14px 16px; background:var(--panel2); opacity:.45}
.badge.won{opacity:1; border-color:var(--ochre)}
.badge .bt{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--ochre)}
.badge .bd{font-size:12.5px; color:var(--muted); margin-top:4px}

/* ---------- misc ---------- */
.crumbs{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--faint); max-width:880px; margin:0 auto 12px}
.crumbs b{color:var(--muted)}
.sheet-footer{display:flex; justify-content:space-between; gap:12px; padding:16px 18px; border-top:1px solid var(--line2)}
.diagram{margin:0 0 18px; border:1px solid var(--line2); border-radius:4px; background:var(--code-bg); padding:10px}
.diagram svg{display:block; width:100%; height:auto}
.dg-label{font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; fill:var(--muted)}
.result-list{list-style:none; margin:0}
.result-list li{margin:0}
.result-list button{width:100%; text-align:left; margin-bottom:6px; font-family:var(--font-body); font-size:13.5px; letter-spacing:0; padding:10px 14px}
.pill{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; border:1px solid var(--line2); color:var(--muted); padding:2px 7px; border-radius:99px; margin-left:8px}
kbd{font-family:var(--font-mono); font-size:.85em; border:1px solid var(--line2); border-bottom-width:2px; border-radius:3px; padding:0 5px; background:var(--panel2)}
#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--panel); border:1px solid var(--ochre); color:var(--ink);
  font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; padding:10px 18px;
  border-radius:3px; transition:transform .25s ease; z-index:99; box-shadow:var(--shadow);
}
#toast.show{transform:translateX(-50%) translateY(0)}
#menu-btn{display:none}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed; z-index:50; width:288px; transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow)}
  #sidebar.open{transform:none}
  #menu-btn{display:inline-block; position:fixed; top:12px; left:12px; z-index:60}
  #main{padding-top:64px}
  .titleblock{grid-template-columns:1fr}
  .titleblock > div + div{border-left:none; border-top:1px solid var(--line2)}
}
</style>
</head>
<body>
<button id="menu-btn" aria-label="Open navigation">☰ INDEX</button>
<div id="app">
  <aside id="sidebar">
    <div class="masthead">
      <div class="mark"><b>CODE&nbsp;FOUNDRY</b><span>REV·A</span></div>
      <div class="sub">PYTHON · C++ · C — FOUNDATIONS</div>
      <div class="mast-row">
        <button id="theme-btn">THEME</button>
        <button id="dash-btn">DASHBOARD</button>
      </div>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="SEARCH LESSONS… ( / )" aria-label="Search lessons">
    </div>
    <nav id="nav" aria-label="Curriculum"></nav>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script>
/* ============================================================
   CODE FOUNDRY — self-contained offline learning app
   All state persists in localStorage under "foundry.*"
   ============================================================ */
"use strict";

/* ---------- tiny helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const store = {
  get(k, d){ try{ const v = localStorage.getItem("foundry."+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("foundry."+k, JSON.stringify(v)); }catch(e){} }
};

let progress   = store.get("progress", {});   // {lessonId:{passed,best,challenge}}
let bookmarks  = store.get("bookmarks", []);
let notes      = store.get("notes", {});
let projDone   = store.get("projects", {});

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- syntax highlighter (small, good enough) ---------- */
const KW = {
  python:"def return if elif else for while in not and or is None True False import from as class try except finally with pass break continue lambda global nonlocal print input range len match case raise assert del yield",
  c:"int char float double void long short unsigned signed if else for while do return break continue switch case default struct typedef sizeof const static enum union goto",
  cpp:"int char float double void long short unsigned signed bool if else for while do return break continue switch case default struct class public private protected new delete const static virtual override template typename namespace using try catch throw this nullptr true false auto enum union sizeof std string vector cout cin endl"
};
function hl(code, lang){
  /* Tokens are stashed in a bank and replaced by control-char
     placeholders (uppercase letters between \u0001..\u0002) that no
     later regex pass can match — fixes markup self-corruption. */
  const bank = [];
  const AZ = n => { let t=""; n++; while(n>0){ n--; t=String.fromCharCode(65+(n%26))+t; n=Math.floor(n/26); } return t; };
  const stash = (m, cls) => { bank.push('<span class="'+cls+'">'+m+'</span>'); return "\u0001"+AZ(bank.length-1)+"\u0002"; };
  let s = esc(code);
  /* protect strings, comments, preprocessor lines first */
  s = s.replace(/(&quot;|")(?:\\.|(?!\1)[^\\\n])*\1|'(?:\\.|[^'\\\n])*'/g, m => stash(m, "tok-str"));
  if(lang==="python"){
    s = s.replace(/#[^\n]*/g, m => stash(m, "tok-com"));
  } else {
    s = s.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, m => stash(m, "tok-com"));
    s = s.replace(/^[ \t]*#\s*\w+[^\n]*/gm, m => stash(m, "tok-pre"));
  }
  /* mark keywords / calls / numbers with control chars only —
     no HTML exists in the string until the very end */
  const words = (KW[lang]||KW.c).split(" ").join("|");
  s = s.replace(new RegExp("\\b("+words+")\\b","g"), "\u0003$1\u0004");
  s = s.replace(/\b([a-zA-Z_]\w*)(\s*\()/g, "\u0005$1\u0004$2");
  s = s.replace(/\b(0[xX][0-9a-fA-F]+|\d+\.?\d*(?:[eE][+-]?\d+)?[fFuUlL]*)\b/g, "\u0006$1\u0004");
  s = s.replace(/\u0003/g,'<span class="tok-kw">')
       .replace(/\u0005/g,'<span class="tok-fn">')
       .replace(/\u0006/g,'<span class="tok-num">')
       .replace(/\u0004/g,'</span>');
  /* restore stashed tokens; loop handles nesting (a string inside a comment) */
  let prev;
  do {
    prev = s;
    s = s.replace(/\u0001([A-Z]+)\u0002/g, (m, az) => {
      let n = 0;
      for(const ch of az) n = n*26 + (ch.charCodeAt(0) - 64);
      return bank[n-1] !== undefined ? bank[n-1] : m;
    });
  } while(s !== prev);
  return s;
}

/* ---------- code block builders ---------- */
let _cbId = 0;
const LANG_NAME = {python:"PYTHON", cpp:"C++", c:"C"};
function codeTabs(ex, label){
  // ex: {python:"...", cpp:"...", c:"..."} — any subset
  const id = "cb"+(_cbId++);
  const langs = Object.keys(ex);
  let head = '<div class="codehead" role="tablist">';
  if(label) head += '<span class="label">'+label+'</span>';
  langs.forEach((l,i)=>{
    head += '<button class="langtab'+(i===0?" on":"")+'" role="tab" data-cb="'+id+'" data-l="'+l+'">'+LANG_NAME[l]+'</button>';
  });
  head += '<button class="copy" data-copy="'+id+'" title="Copy code">COPY ⧉</button></div>';
  let panes = "";
  langs.forEach((l,i)=>{
    panes += '<div class="codepane'+(i===0?" on":"")+'" id="'+id+'-'+l+'" data-raw="'+encodeURIComponent(ex[l])+'"><pre><code>'+hl(ex[l],l)+'</code></pre></div>';
  });
  return '<div class="codeblock" data-id="'+id+'">'+head+panes+'</div>';
}
function codeOne(lang, src, label){
  const id = "cb"+(_cbId++);
  return '<div class="codeblock" data-id="'+id+'">'+
    '<div class="codehead"><span class="label">'+(label||LANG_NAME[lang])+'</span>'+
    '<button class="copy" data-copy="'+id+'" title="Copy code">COPY ⧉</button></div>'+

<p class="lede">A program is a list of instructions for a machine that follows them exactly, extremely fast, and with zero imagination. Programming is the craft of writing those instructions so precisely that nothing is left to interpretation.</p>

<h2>Why this matters before any syntax</h2>
<p>Every bug you will ever write comes from the same gap: the computer did what you <strong>said</strong>, not what you <strong>meant</strong>. A CPU cannot infer, guess, or fill in blanks. If you internalise that now, error messages stop feeling personal and start feeling like a checklist.</p>

<h2>How a computer runs code</h2>
<p>At the bottom of everything is the <strong>CPU</strong>, a chip that understands only <em>machine code</em>: raw numbers that mean things like "add these two values" or "jump to instruction 4096". Every language you will learn — Python, C++, C — is ultimately a human-friendly way of producing those numbers.</p>
<ol>
<li><strong>You write source code</strong> — plain text, readable by humans.</li>
<li><strong>A translator converts it</strong> — a compiler or an interpreter (next lesson).</li>
<li><strong>The CPU executes instructions one at a time</strong> — fetch, decode, execute, repeat, billions of times per second.</li>
</ol>

<p>Python fits in four lines because an interpreter does the housekeeping for you. C and C++ ask you to declare an entry point (<code>main</code>), state every type, and pull in an I/O library — in exchange you get precise control and speed. That trade is the running theme of this whole course.</p>

<p class="lede">Python, C and C++ are all text until something translates them. The <em>kind</em> of translator — compiler or interpreter — explains almost every practical difference between the languages: speed, error timing, portability, and workflow.</p>

<h2>Two ways to translate</h2>
<table class="spec">
<tr><th>MODEL</th><th>HOW IT WORKS</th><th>USED BY</th></tr>
<tr><td><strong>Compiled</strong></td><td>The whole program is translated to machine code <em>ahead of time</em>, producing an executable file. You run the file; the source is no longer needed.</td><td>C, C++</td></tr>
<tr><td><strong>Interpreted</strong></td><td>A program called the interpreter reads your source and executes it <em>as it goes</em> (Python first compiles to internal bytecode, then a virtual machine runs that).</td><td>Python</td></tr>
</table>

<h2>Why the difference exists</h2>
<p>Compilation front-loads the work: the compiler can spend seconds analysing and optimising, so the finished executable runs at full machine speed. Interpretation defers the work: you skip the build step entirely and can run one line at a time, which makes experimenting frictionless — at the cost of runtime speed.</p>

<h2>The C / C++ build pipeline</h2>
<ol>
<li><strong>Preprocessing</strong> — lines starting with <code>#</code> are handled first. <code>#include &lt;stdio.h&gt;</code> literally pastes the header's text into your file.</li>
<li><strong>Compilation</strong> — each <code>.c</code> / <code>.cpp</code> file becomes an <em>object file</em> of machine code with unresolved references.</li>
<li><strong>Linking</strong> — object files and libraries are stitched into one executable.</li>
</ol>

<p class="lede">A variable is a named piece of memory. Everything else in this lesson — declaration, initialisation, assignment — is just the lifecycle of that box: reserving it, filling it the first time, and changing its contents later.</p>

<h2>The three lifecycle moments</h2>

<p>The rule in all three languages: <strong>inner scopes can see outward, outer scopes cannot see inward.</strong> A function's locals are invisible from anywhere else — which is precisely what makes functions safe to reason about in isolation.</p>

<p class="lede">A function is a named, reusable block with a doorway in (parameters) and a doorway out (the return value). Functions are the single most important structuring tool in programming — everything larger (modules, classes, programs) is built from them.</p>

<h2>Why functions exist</h2>
<ul>
<li><strong>Reuse</strong> — write the VAT calculation once, call it everywhere.</li>
<li><strong>Naming</strong> — <code>is_leap_year(y)</code> reads as English; the four-condition test it hides does not.</li>
<li><strong>Isolation</strong> — locals inside can't be touched from outside, so you can reason about 10 lines instead of 1,000.</li>
<li><strong>Testing</strong> — a function with inputs and outputs can be checked in one line.</li>
</ul>

<h2>Definition, parameters, return</h2>
` + codeTabs({

    """Return the area of a width x height rectangle."""
    return width * height          # return: the doorway out

a = area_rect(3.0, 4.5)            # arguments: actual values passed

int main(void) {

    int x;
    while (scanf("%d", &x) == 1 && x != -1) {
        if (count == capacity) {
            capacity *= 2;
            int *bigger = realloc(buf, capacity * sizeof(int));
            if (!bigger) { free(buf); return 1; }

<p class="lede">You've been keeping data (variables) and behaviour (functions) in separate drawers. A class staples them together: a blueprint declaring <em>what an object knows</em> (attributes) and <em>what it can do</em> (methods). Objects are the individual items built from that blueprint.</p>

<h2>Why OOP exists</h2>
<p>Imagine tracking 50 bank accounts with parallel lists: <code>names</code>, <code>balances</code>, <code>opened_dates</code>… and 30 loose functions that must all agree on how the lists line up. One sorting mistake and every account is corrupted. A class turns each account into a self-contained unit that carries its own data and enforces its own rules.</p>

/* each node holds a value and the ADDRESS of the next node —

    struct Node *next;

int main(void) {
    /* build 10 -> 20 -> 30 by inserting at the head */
    Node *head = NULL;
    int vals[] = {30, 20, 10};
    for (int i = 0; i < 3; i++) {
        Node *n = malloc(sizeof(Node));
        n->value = vals[i];
        n->next = head;      /* new node points at old head */
        head = n;            /* head moves to the new node   */

    printf("NULL\\n");        /* 10 -> 20 -> 30 -> NULL */

    while (head) {           /* free every node */
        Node *next = head->next;
        free(head);
        head = next;
    }

}`) + `

<h2>Queue: first in, first out (FIFO)</h2>
` + codeOne("python",
`from collections import deque
q = deque()
q.append("job1")          # enqueue at the back
q.append("job2")
q.append("job3")
print(q.popleft())        # job1 — the FIRST thing added
# Print queues, task schedulers, anything fair. (A plain list's
# pop(0) works but shuffles every element left — deque doesn't.)`) + `
<h2>Hash tables: how dicts are fast</h2>
<p>A dict finds <code>d["CCWW"]</code> among a million keys near-instantly. The trick: a <strong>hash function</strong> converts the key to a number, which is used as an <em>array index</em>. Lookup becomes "compute, jump" — no searching. Two keys landing on one slot (a <em>collision</em>) are handled by chaining a small list there. This is also why keys must be immutable (l16): if a key could change, its hash — its address — would lie.</p>

<h2>Trees: hierarchy</h2>
` + codeOne("python",
`# a node with CHILDREN instead of one 'next' — folders, org charts,
# HTML documents, game decisions. Recursion (l13) is the natural tool:
tree = ("root", [
    ("docs", [("cv.pdf", []), ("notes.txt", [])]),
    ("code", [("main.py", [])]),
])

def show(node, depth=0):
    name, children = node
    print("  " * depth + name)
    for child in children:
        show(child, depth + 1)

show(tree)
# A BINARY SEARCH TREE keeps left < node < right, making lookup a
# series of halvings — the same power you'll meet in lesson 25.`) + `
<h2>Graphs: networks</h2>
` + codeOne("python",
`# nodes + connections, no hierarchy: road maps, social networks,
# pipe networks. Simplest storage — the adjacency dict:
pipes = {
    "PB":   ["TC", "SW"],
    "TC":   ["PB", "CCWW"],
    "SW":   ["PB"],
    "CCWW": ["TC"],
}
print(pipes["TC"])   # what connects to TC?`) + `
<h2>The map, on one card</h2>
<table class="spec">
<tr><th>STRUCTURE</th><th>SHAPE</th><th>SUPERPOWER</th><th>WEAKNESS</th></tr>
<tr><td>Array / list</td><td>Contiguous row</td><td>Instant access by index</td><td>Insert/delete at front shifts everything</td></tr>
<tr><td>Linked list</td><td>Chain of nodes</td><td>Instant insert/remove at known spots</td><td>No jumping — walk to reach anything</td></tr>
<tr><td>Stack</td><td>Pile (LIFO)</td><td>Perfect undo / nesting model</td><td>Top only</td></tr>
<tr><td>Queue</td><td>Line (FIFO)</td><td>Fairness, order preserved</td><td>Ends only</td></tr>
<tr><td>Hash table / dict</td><td>Keyed slots</td><td>Near-instant lookup by key</td><td>No ordering by value</td></tr>
<tr><td>Tree</td><td>Hierarchy</td><td>Halving searches; models nesting</td><td>Needs balance to stay fast</td></tr>
<tr><td>Graph</td><td>Network</td><td>Models any relationship</td><td>Algorithms get subtle</td></tr>
</table>
` + callout("KEY IDEA","Choosing a data structure = choosing which operations are cheap. Ask what you do <em>most</em>: index by position → array; look up by name → dict; only ever the newest → stack; strict fairness → queue; hierarchy → tree; connections → graph.") + `

<h2>Summary</h2>
<ul>
<li>Every structure is nodes + pointers or slots + indexes, arranged to make chosen operations cheap.</li>
<li>Stack/queue are usage disciplines; hash tables buy speed with hashing; trees and graphs model shape.</li>
<li>You now hold the vocabulary for lesson 25, where cost gets a notation.</li>
</ul>
<h3>Further reading</h3>
<p>Implement a stack in C on top of your l18 growable buffer · visualgo.net animates every structure here — worth an evening.</p>

<p class="lede">An algorithm is a recipe; Big O is the label saying how the cooking time grows as the ingredients multiply. Master two searches, two sorts and five growth rates, and you can reason about the cost of almost any code you write.</p>

<h2>Big O: counting growth, not seconds</h2>
<p>We don't ask "how many milliseconds?" (that depends on the machine). We ask: <em>if the input gets 10× bigger, how much more work happens?</em></p>
<table class="spec">
<tr><th>CLASS</th><th>NAME</th><th>10× INPUT →</th><th>TYPICAL EXAMPLE</th></tr>
<tr><td>O(1)</td><td>Constant</td><td>Same work</td><td>Array index, dict lookup</td></tr>
<tr><td>O(log n)</td><td>Logarithmic</td><td>+ a few steps</td><td>Binary search</td></tr>
<tr><td>O(n)</td><td>Linear</td><td>10× work</td><td>One loop over the data</td></tr>
<tr><td>O(n²)</td><td>Quadratic</td><td>100× work</td><td>Nested loops over the data</td></tr>
<tr><td>O(2ⁿ)</td><td>Exponential</td><td>Astronomical</td><td>Trying every subset</td></tr>
</table>
<p>Reading code: one pass = O(n). A loop inside a loop, both over the data = O(n²) — your l11 prime sieve and pair-matcher live here. Repeated halving = O(log n). Constants are ignored: a loop doing 3 things is still O(n); the shape of growth is what survives scale.</p>

<h2>Linear search: the honest baseline</h2>
` + codeOne("python",
`def linear_search(items, target):     # O(n): may touch everything
    for i, x in enumerate(items):
        if x == target:
            return i
    return -1
# Unsorted data? This is also the BEST you can do — nothing tells
# you where to look, so you must be prepared to look everywhere.`) + `
<h2>Binary search: the power of sorted</h2>
` + codeOne("python",
`def binary_search(sorted_items, target):   # O(log n)
    lo, hi = 0, len(sorted_items) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if sorted_items[mid] == target:
            return mid
        if sorted_items[mid] < target:
            lo = mid + 1        # target is in the RIGHT half
        else:
            hi = mid - 1        # target is in the LEFT half
    return -1

# every comparison HALVES the search space:
# 1,000 items -> 10 steps.  1,000,000 -> 20.  1 billion -> 30.`) + callout("KEY IDEA","That's the whole speed story of computing in one contrast: 1 billion items, linear search up to 1,000,000,000 checks — binary search, 30. <strong>Sorted order is what you pay once so every later search is nearly free.</strong> (It's also the l10 halving-counter challenge wearing a suit.)") + `

<h2>Bubble sort: learn it, then retire it</h2>
` + codeTabs({
python:
`def bubble_sort(a):                 # O(n^2): nested loops
    n = len(a)
    for i in range(n - 1):
        swapped = False
        for j in range(n - 1 - i):  # each pass floats the biggest
            if a[j] > a[j + 1]:     # remaining value to the top
                a[j], a[j + 1] = a[j + 1], a[j]
                swapped = True
        if not swapped:             # a full quiet pass = sorted
            break

data = [42, 8, 23, 4, 16, 15]
bubble_sort(data)

                int t = a[j];
                a[j] = a[j + 1];
                a[j + 1] = t;
            }

}`}) + `
<h2>Selection sort: a second O(n²) shape</h2>
` + codeOne("python",

    n = len(a)
    for i in range(n - 1):
        smallest = i
        for j in range(i + 1, n):     # find the minimum of the rest
            if a[j] < a[smallest]:
                smallest = j
        a[i], a[smallest] = a[smallest], a[i]   # one swap per pass

<h2>Common beginner mistakes</h2>
<ul>
<li>Binary-searching unsorted data — it confidently returns wrong answers.</li>
<li>Believing Big O predicts wall-clock time on small inputs — for n = 20, anything is instant; growth classes matter at scale.</li>
<li>Nesting a hidden loop: <code>if x in my_list</code> inside a loop over the list is O(n²) wearing a disguise (a set makes it O(n)).</li>

<h2>Summary</h2>

<li>Sorting is an investment: O(n log n) once, O(log n) searches forever after.</li>

`class Student:
    def __init__(self, name):
        self.name = name
        self.scores = []

    def add_score(self, s):
        if not 0 <= s <= 100:
            raise ValueError(f"score out of range: {s}")
        self.scores.append(s)

    def average(self):
        return sum(self.scores) / len(self.scores) if self.scores else 0.0

    def grade(self):
        avg = self.average()
        for cutoff, letter in ((90,"A"),(80,"B"),(70,"C"),(60,"D")):
            if avg >= cutoff:
                return letter
        return "F"

class Cohort:
    def __init__(self):
        self.students = []

    def add(self, name):
        self.students.append(Student(name))

    def find(self, name):
        for s in self.students:
            if s.name.lower() == name.lower():
                return s
        return None

    def report(self):
        print(f"{'NAME':<12}{'AVG':>7}{'GRADE':>7}")
        for s in sorted(self.students, key=lambda x: -x.average()):
            print(f"{s.name:<12}{s.average():>7.1f}{s.grade():>7}")

for name, scores in [("Ana",[92,88]), ("Bo",[71,64]), ("Cy",[55,68])]:

import string

def generate(length=16, digits=True, symbols=True):
    alphabet = string.ascii_letters
    required = [string.ascii_lowercase, string.ascii_uppercase]
    if digits:
        alphabet += string.digits
        required.append(string.digits)

["Call stack","The stack of frames tracking active function calls; each frame holds one call's locals."],
["Compiler","A translator that converts a whole program to machine code ahead of time (C, C++)."],
["Constructor","The special method that initialises a new object: __init__ in Python, the class-named function in C++."],
["Dangling pointer","A pointer to memory that has been freed or gone out of scope. Dereferencing it is undefined behaviour."],
["Declaration","Introducing a name and type to the compiler, e.g. int score; — reserving the box."],
["Dereference","Following a pointer to the value it addresses: *p."],
["Dictionary / hash table","Key→value structure with near-constant-time lookup via hashing."],
["Encapsulation","Keeping data changeable only through methods that enforce its rules."],
["Exception","A runtime error object that propagates up the call stack until caught (try/except, try/catch)."],
["Garbage collection","Automatic reclamation of unreachable heap memory (Python's model)."],
["Heap","Memory allocated on request (malloc/new), living until explicitly freed or collected."],
["Immutable","Cannot be changed after creation: Python strings, tuples, ints."],
["Initialisation","Giving a variable its first value."],
["Interpreter","A program that executes source code directly, translating as it goes (Python)."],
["Linker","Build stage that joins compiled object files and libraries into one executable."],
["Memory leak","Heap memory whose last pointer is lost before freeing — allocated forever."],
["Modulo (%)","Remainder after division. 17 % 5 == 2. Wraps, cycles, tests divisibility."],
["Null terminator","The hidden 0 byte ('\\0') marking the end of a C string."],
["Overloading","Multiple functions sharing a name, distinguished by parameter types (C++)."],
["Parameter","The placeholder name in a function definition. Receives an argument's value."],
["Pass by value","Copying an argument into the parameter; the original is untouched (C's default)."],
["Pointer","A variable holding a memory address. & takes an address, * follows one."],
["Polymorphism","One call, many behaviours: the object's real type selects the method (virtual/duck typing)."],
["RAII","C++ idiom: resources acquired in constructors, released in destructors — cleanup guaranteed at scope exit."],
["Recursion","A function solving a problem by calling itself on a smaller version, down to a base case."],
["Scope","The region of code where a name is visible. Inner scopes see out; outer can't see in."],
["Segmentation fault","OS-enforced crash for touching memory you don't own — usually a pointer bug."],
["Short-circuit","&&/and stops at first false; ||/or at first true. Guards dangerous right-hand sides."],
["Smart pointer","C++ pointer object (unique_ptr etc.) that frees its target automatically."],
["Stack (memory)","Automatic per-call storage for locals; freed on return. Small and fast."],
["Static typing","Types fixed per variable at compile time (C/C++). Python's dynamic typing attaches type to the value."],
["Truthiness","Non-boolean values used as conditions: 0/empty/None are falsy; most else truthy."],
["Undefined behaviour","C/C++ situations with no guaranteed outcome (out-of-bounds, use-after-free). Anything may happen."]
];

<script>
"use strict";
/* ============================================================
   APP ENGINE — navigation, rendering, quizzes, persistence
   ============================================================ */

const PASS_MARK = idx => Math.ceil(LESSONS[idx].quiz.length * 0.75);

function lessonIndex(id){ return LESSONS.findIndex(l => l.id === id); }
function isPassed(id){ return !!(progress[id] && progress[id].passed); }
function isUnlocked(idx){ return idx === 0 || isPassed(LESSONS[idx - 1].id); }
function passedCount(){ return LESSONS.filter(l => isPassed(l.id)).length; }

const BADGES = [
["FIRST LINE","Pass your first lesson quiz", () => passedCount() >= 1],
["FIVE SHEETS","Pass five lesson quizzes", () => passedCount() >= 5],
["FLOW CONTROLLER","Complete every Control Flow and Loops lesson", () => LESSONS.filter(l => l.sec === 3 || l.sec === 4).every(l => isPassed(l.id))],
["FUNCTION FOUNDRY","Complete both Functions lessons", () => LESSONS.filter(l => l.sec === 5).every(l => isPassed(l.id))],
["POINTER WRANGLER","Pass the Pointers lesson — the C rite of passage", () => isPassed("l17")],
["MEMORY MARSHAL","Pass both Pointers & Memory lessons", () => LESSONS.filter(l => l.sec === 7).every(l => isPassed(l.id))],
["OBJECT BUILDER","Complete both OOP lessons", () => LESSONS.filter(l => l.sec === 8).every(l => isPassed(l.id))],
["CHALLENGER","Mark ten coding challenges complete", () => LESSONS.filter(l => progress[l.id] && progress[l.id].challenge).length >= 10],
["SHIPWRIGHT","Mark three projects complete", () => Object.values(projDone).filter(Boolean).length >= 3],
["PERFECT SHEET","Score 100% on any quiz", () => LESSONS.some(l => progress[l.id] && progress[l.id].best === l.quiz.length)],
["FULL REVISION","Pass every lesson in the curriculum", () => passedCount() === LESSONS.length]
];

let view = store.get("view", {type:"dash"});
let quizState = null;   // {answers:[], checked:false}

/* ---------- sidebar nav ---------- */
function renderNav(filter){
  const nav = $("#nav");
  const f = (filter || "").trim().toLowerCase();
  let html = "";

  if(f){
    const hits = LESSONS.filter(l => (l.title + " " + l.keywords + " " + SECTIONS[l.sec]).toLowerCase().includes(f));
    html += '<div class="nav-sec"><div class="nav-sec-title"><span>RESULTS</span><span class="cnt">' + hits.length + '</span></div>';
    if(!hits.length) html += '<div class="nav-sec-title" style="padding-top:8px">NO MATCHES — TRY A BROADER TERM</div>';
    hits.forEach(l => { html += navItem(l); });
    html += '</div>';
    nav.innerHTML = html;
    bindNav(nav);
    return;
  }

  SECTIONS.forEach((name, si) => {
    const items = LESSONS.filter(l => l.sec === si);
    const done = items.filter(l => isPassed(l.id)).length;
    html += '<div class="nav-sec"><div class="nav-sec-title"><span>S' + String(si+1).padStart(2,"0") + ' · ' + name + '</span><span class="cnt">' + done + '/' + items.length + '</span></div>';
    items.forEach(l => { html += navItem(l); });
    html += '</div>';
  });

  html += '<div class="nav-sec"><div class="nav-sec-title"><span>PROJECT BAY</span><span class="cnt">' + Object.values(projDone).filter(Boolean).length + '/' + PROJECTS.length + '</span></div>';
  PROJECTS.forEach(p => {
    const on = view.type === "project" && view.id === p.id;
    html += '<button class="nav-item' + (on ? " active" : "") + '" data-proj="' + p.id + '"><span class="st ' + (projDone[p.id] ? "done" : "") + '">' + (projDone[p.id] ? "■" : "□") + '</span><span>' + p.title + '</span></button>';
  });
  html += '</div>';

  html += '<div class="nav-util">';
  [["dash","DASHBOARD & BADGES"],["glossary","GLOSSARY"],["cheats","CHEAT SHEETS"]].forEach(([t, label]) => {
    const on = view.type === t;
    html += '<button class="nav-item' + (on ? " active" : "") + '" data-view="' + t + '"><span class="st">▸</span><span>' + label + '</span></button>';
  });
  html += '</div>';

  nav.innerHTML = html;
  bindNav(nav);
}

function navItem(l){
  const idx = lessonIndex(l.id);
  const unlocked = isUnlocked(idx);
  const passed = isPassed(l.id);
  const on = view.type === "lesson" && view.id === l.id;
  const st = passed ? '<span class="st done">✓</span>' : unlocked ? '<span class="st">' + String(idx+1).padStart(2,"0") + '</span>' : '<span class="st lock">🔒</span>';
  const bk = bookmarks.includes(l.id) ? '<span class="bkm">★</span>' : '';
  return '<button class="nav-item' + (on ? " active" : "") + (unlocked ? "" : " locked") + '" data-lesson="' + l.id + '">' + st + '<span>' + l.title + '</span>' + bk + '</button>';
}

function bindNav(nav){
  $$(".nav-item", nav).forEach(btn => {
    btn.addEventListener("click", () => {
      if(btn.dataset.lesson){
        const idx = lessonIndex(btn.dataset.lesson);
        if(!isUnlocked(idx)){
          toast("LOCKED — PASS THE PREVIOUS QUIZ (75%) TO OPEN");
          return;
        }
        go({type:"lesson", id:btn.dataset.lesson, tab:"learn"});
      } else if(btn.dataset.proj){
        go({type:"project", id:btn.dataset.proj});
      } else if(btn.dataset.view){
        go({type:btn.dataset.view});
      }
      $("#sidebar").classList.remove("open");
    });
  });
}

function go(v){
  view = v;
  quizState = null;
  store.set("view", v);
  render();
  $("#main").scrollIntoView ? window.scrollTo({top:0}) : null;
}

/* ---------- main render ---------- */
function render(){
  renderNav($("#search").value);
  const main = $("#main");
  if(view.type === "lesson") main.innerHTML = renderLesson(view.id, view.tab || "learn");
  else if(view.type === "project") main.innerHTML = renderProject(view.id);
  else if(view.type === "glossary") main.innerHTML = renderGlossary();
  else if(view.type === "cheats") main.innerHTML = renderCheats();
  else main.innerHTML = renderDash();
  bindMain();
}

/* ---------- lesson sheet ---------- */
function renderLesson(id, tab){
  const idx = lessonIndex(id);
  const l = LESSONS[idx];
  const p = progress[id] || {};
  const passed = !!p.passed;
  const stamp = passed
    ? '<span class="stamp pass">PASSED ' + (p.best !== undefined ? p.best + "/" + l.quiz.length : "") + '</span>'
    : '<span class="stamp">IN PROGRESS</span>';
  const bk = bookmarks.includes(id);

  let html = '<div class="crumbs">CODE FOUNDRY / <b>S' + String(l.sec+1).padStart(2,"0") + ' ' + SECTIONS[l.sec] + '</b> / SHEET ' + String(idx+1).padStart(2,"0") + '</div>';
  html += '<div class="sheet"><div class="titleblock">';
  html += '<div><div class="tb-eyebrow">SHEET ' + String(idx+1).padStart(2,"0") + ' / ' + LESSONS.length + ' — ' + SECTIONS[l.sec] + '</div><div class="tb-title">' + l.title + '</div></div>';
  html += '<div class="tb-cell">EST. TIME<b>' + l.mins + ' MIN</b></div>';
  html += '<div class="tb-cell" style="text-align:center">' + stamp + '<br><button class="ghost" id="bk-btn" style="margin-top:8px">' + (bk ? "★ BOOKMARKED" : "☆ BOOKMARK") + '</button></div>';
  html += '</div>';

  html += '<div class="sheet-tabs">';
  [["learn","LEARN"],["quiz","QUIZ · GATE"],["challenge","CHALLENGE"],["notes","MY NOTES"]].forEach(([t, label]) => {
    html += '<button class="' + (tab === t ? "on" : "") + '" data-tab="' + t + '">' + label + '</button>';
  });
  html += '</div><div class="sheet-body">';

  if(tab === "learn") html += l.body();
  else if(tab === "quiz") html += renderQuiz(l);
  else if(tab === "challenge") html += renderChallenge(l);
  else html += renderNotes(l);

  html += '</div><div class="sheet-footer">';
  html += idx > 0 ? '<button data-nav-lesson="' + LESSONS[idx-1].id + '">← ' + LESSONS[idx-1].title.toUpperCase() + '</button>' : '<span></span>';
  if(idx < LESSONS.length - 1){
    const nextOpen = isPassed(id);
    html += '<button class="' + (nextOpen ? "primary" : "") + '" data-nav-lesson="' + LESSONS[idx+1].id + '" ' + (nextOpen ? "" : "disabled title='Pass this quiz to unlock'") + '>' + LESSONS[idx+1].title.toUpperCase() + ' →</button>';
  }
  html += '</div></div>';
  return html;
}

function renderQuiz(l){
  if(!quizState || quizState.id !== l.id) quizState = {id:l.id, answers:new Array(l.quiz.length).fill(-1), checked:false};
  const qs = quizState;
  const need = PASS_MARK(lessonIndex(l.id));
  let html = '<p class="lede">Pass mark: ' + need + ' / ' + l.quiz.length + '. Passing stamps this sheet and unlocks the next lesson. Retake any time — best score is kept.</p>';

  l.quiz.forEach((q, qi) => {
    html += '<div class="quiz-q"><div class="qh"><span class="qn">Q' + String(qi+1).padStart(2,"0") + '</span>' + q.q + '</div><div class="quiz-opts">';
    q.a.forEach((opt, oi) => {
      let cls = "quiz-opt";
      if(qs.checked){
        if(oi === q.c) cls += " right";
        else if(qs.answers[qi] === oi) cls += " wrong";
      } else if(qs.answers[qi] === oi) cls += " sel";
      html += '<button class="' + cls + '" data-q="' + qi + '" data-o="' + oi + '" ' + (qs.checked ? "disabled" : "") + '>' + esc(opt) + '</button>';
    });
    html += '</div><div class="quiz-why' + (qs.checked ? " show" : "") + '">' + q.why + '</div></div>';
  });

  html += '<div class="quiz-foot">';
  if(!qs.checked){
    html += '<button class="primary" id="quiz-submit">SUBMIT ANSWERS</button>';
  } else {
    const score = qs.answers.filter((a, i) => a === l.quiz[i].c).length;
    const passed = score >= need;
    html += '<span class="stamp ' + (passed ? "pass" : "") + ' pop">' + (passed ? "PASSED" : "NOT YET") + ' ' + score + '/' + l.quiz.length + '</span>';
    html += '<button id="quiz-retry">RETAKE</button>';
    if(passed && lessonIndex(l.id) < LESSONS.length - 1){
      html += '<button class="primary" data-nav-lesson="' + LESSONS[lessonIndex(l.id)+1].id + '">NEXT LESSON →</button>';
    }
  }
  const best = progress[l.id] && progress[l.id].best;
  if(best !== undefined) html += '<span class="quiz-score">BEST: ' + best + '/' + l.quiz.length + '</span>';
  html += '</div>';
  return html;
}

function renderChallenge(l){
  const ch = l.challenge;
  const done = !!(progress[l.id] && progress[l.id].challenge);
  let html = '<h2 style="margin-top:0">' + ch.title + '</h2><p>' + ch.brief + '</p>';
  html += '<h3>Hints — open only when stuck</h3>';
  ch.hints.forEach((h, i) => {
    html += '<details class="hint"><summary>HINT ' + (i+1) + '</summary><div class="hint-body">' + h + '</div></details>';
  });
  html += '<details class="hint"><summary>REFERENCE SOLUTION — attempt it first</summary><div class="hint-body">' + codeOne(ch.solution.lang, ch.solution.code) + '<p>Your version doesn\u2019t need to match — working and understood beats identical.</p></div></details>';
  html += '<div class="quiz-foot"><button class="' + (done ? "" : "primary") + '" id="ch-toggle">' + (done ? "✓ MARKED COMPLETE — UNMARK" : "MARK CHALLENGE COMPLETE") + '</button></div>';
  return html;
}

function renderNotes(l){
  const v = notes[l.id] || "";
  return '<p class="lede">Notes for this sheet only — saved automatically on this device.</p>' +
    '<textarea id="notes-area" placeholder="Gotchas, questions, things to drill again…">' + esc(v) + '</textarea>';
}

/* ---------- project sheet ---------- */
function renderProject(id){
  const p = PROJECTS.find(x => x.id === id);
  const done = !!projDone[id];
  let html = '<div class="crumbs">CODE FOUNDRY / <b>PROJECT BAY</b> / ' + p.id.toUpperCase() + '</div>';
  html += '<div class="sheet"><div class="titleblock">';
  html += '<div><div class="tb-eyebrow">PROJECT — ' + p.langs.toUpperCase() + '</div><div class="tb-title">' + p.title + '</div></div>';
  html += '<div class="tb-cell">RECOMMENDED<b>' + p.after + '</b></div>';
  html += '<div class="tb-cell" style="text-align:center">' + (done ? '<span class="stamp pass">SHIPPED</span>' : '<span class="stamp">ON THE BENCH</span>') + '</div>';
  html += '</div><div class="sheet-body">';
  html += '<p class="lede">' + p.goal + '</p>';
  html += '<h2>Build sequence</h2><ol>';
  p.steps.forEach(s => { html += '<li>' + s + '</li>'; });
  html += '</ol><h2>Reference implementation</h2><p>Build yours first — then compare decisions, not just lines.</p>';
  html += codeOne(p.code.lang, p.code.src);
  html += '<h2>Challenge extensions</h2><ul>';
  p.ext.forEach(e => { html += '<li>' + e + '</li>'; });
  html += '</ul>';
  html += '<div class="quiz-foot"><button class="' + (done ? "" : "primary") + '" id="proj-toggle">' + (done ? "✓ SHIPPED — UNMARK" : "MARK PROJECT COMPLETE") + '</button></div>';
  html += '</div></div>';
  return html;
}

/* ---------- dashboard / glossary / cheats ---------- */
function renderDash(){
  const total = LESSONS.length, done = passedCount();
  const pct = Math.round(done / total * 100);
  const chDone = LESSONS.filter(l => progress[l.id] && progress[l.id].challenge).length;
  const pDone = Object.values(projDone).filter(Boolean).length;
  const next = LESSONS.find((l, i) => isUnlocked(i) && !isPassed(l.id));

  let html = '<div class="crumbs">CODE FOUNDRY / <b>DASHBOARD</b></div><div class="sheet"><div class="titleblock">';
  html += '<div><div class="tb-eyebrow">PROGRESS REGISTER</div><div class="tb-title">Dashboard</div></div>';
  html += '<div class="tb-cell">CURRICULUM<b>' + pct + '% PASSED</b></div>';
  html += '<div class="tb-cell">REVISION<b>PY · C++ · C</b></div>';
  html += '</div><div class="sheet-body">';
  html += '<div class="dash-grid">';
  html += '<div class="dash-card"><div class="k">LESSONS PASSED</div><div class="v">' + done + '<small> / ' + total + '</small></div><div class="progressbar"><i style="width:' + pct + '%"></i></div></div>';
  html += '<div class="dash-card"><div class="k">CHALLENGES DONE</div><div class="v">' + chDone + '<small> / ' + total + '</small></div><div class="progressbar"><i style="width:' + Math.round(chDone/total*100) + '%"></i></div></div>';
  html += '<div class="dash-card"><div class="k">PROJECTS SHIPPED</div><div class="v">' + pDone + '<small> / ' + PROJECTS.length + '</small></div><div class="progressbar"><i style="width:' + Math.round(pDone/PROJECTS.length*100) + '%"></i></div></div>';
  html += '</div>';

  if(next){
    html += '<div class="callout"><span class="tag">NEXT ON THE BOARD</span><p><strong>' + next.title + '</strong> — ' + SECTIONS[next.sec] + ' · ~' + next.mins + ' min. <button class="primary" data-nav-lesson="' + next.id + '" style="margin-left:10px">OPEN SHEET →</button></p></div>';
  } else if(done === total){
    html += '<div class="callout"><span class="tag">FULL REVISION</span><p>Every sheet stamped. The Project Bay and challenge extensions are your gym now — and your seven-track Command Center is waiting for these reps to be logged.</p></div>';

    html += '<h2>Bookmarked sheets</h2><ul class="result-list">';
    bookmarks.forEach(id => {
      const l = LESSONS[lessonIndex(id)];

    });
    html += '</ul>';
  }

  html += '<h2>Badges</h2><div class="badges">';
  BADGES.forEach(([name, desc, test]) => {
    html += '<div class="badge' + (test() ? " won" : "") + '"><div class="bt">' + (test() ? "◆ " : "◇ ") + name + '</div><div class="bd">' + desc + '</div></div>';
  });
  html += '</div>';

  html += '<h2>Housekeeping</h2><p>All progress lives in this browser\u2019s local storage — nothing leaves your machine. <button id="reset-btn">RESET ALL PROGRESS</button></p>';
  html += '</div></div>';
  return html;
}

function renderGlossary(){
  let html = '<div class="crumbs">CODE FOUNDRY / <b>GLOSSARY</b></div><div class="sheet"><div class="titleblock">';
  html += '<div><div class="tb-eyebrow">TERMINOLOGY REGISTER — ' + GLOSSARY.length + ' TERMS</div><div class="tb-title">Glossary</div></div></div><div class="sheet-body">';
  html += '<table class="spec"><tr><th>TERM</th><th>DEFINITION</th></tr>';
  GLOSSARY.forEach(([t, d]) => { html += '<tr><td><strong>' + t + '</strong></td><td>' + d + '</td></tr>'; });
  html += '</table></div></div>';
  return html;
}

function renderCheats(){
  let html = '<div class="crumbs">CODE FOUNDRY / <b>CHEAT SHEETS</b></div><div class="sheet"><div class="titleblock">';
  html += '<div><div class="tb-eyebrow">QUICK REFERENCE — COPY FREELY</div><div class="tb-title">Cheat sheets</div></div></div><div class="sheet-body">';
  html += '<p class="lede">One screen per language. Use these while doing challenges — recognition first, recall follows.</p>';
  html += codeOne("python", CHEATS.python, "PYTHON");
  html += codeOne("c", CHEATS.c, "C");
  html += codeOne("cpp", CHEATS.cpp, "C++");
  html += '</div></div>';
  return html;
}

/* ---------- event binding for rendered content ---------- */
function bindMain(){
  const main = $("#main");

  $$("[data-nav-lesson]", main).forEach(b => b.addEventListener("click", () => {
    const idx = lessonIndex(b.dataset.navLesson);
    if(!isUnlocked(idx)){ toast("LOCKED — PASS THE PREVIOUS QUIZ FIRST"); return; }
    go({type:"lesson", id:b.dataset.navLesson, tab:"learn"});
  }));

  $$(".sheet-tabs button", main).forEach(b => b.addEventListener("click", () => {
    view.tab = b.dataset.tab; store.set("view", view); render();
  }));

  $$(".langtab", main).forEach(b => b.addEventListener("click", () => {
    const block = b.closest(".codeblock");
    $$(".langtab", block).forEach(x => x.classList.toggle("on", x === b));
    $$(".codepane", block).forEach(p => p.classList.toggle("on", p.id === b.dataset.cb + "-" + b.dataset.l));
  }));

  $$(".copy", main).forEach(b => b.addEventListener("click", () => {
    const block = b.closest(".codeblock");
    const pane = $(".codepane.on", block);
    const raw = decodeURIComponent(pane.dataset.raw || "");
    const finish = ok => toast(ok ? "COPIED TO CLIPBOARD" : "COPY FAILED — SELECT MANUALLY");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(raw).then(() => finish(true), () => finish(false));
    } else {
      const ta = document.createElement("textarea");
      ta.value = raw; document.body.appendChild(ta); ta.select();
      let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); finish(ok);
    }
  }));

  $$(".quiz-opt", main).forEach(b => b.addEventListener("click", () => {
    if(!quizState || quizState.checked) return;
    quizState.answers[+b.dataset.q] = +b.dataset.o;
    render();
  }));

  const submit = $("#quiz-submit", main);
  if(submit) submit.addEventListener("click", () => {
    const l = LESSONS[lessonIndex(view.id)];
    if(quizState.answers.includes(-1)){ toast("ANSWER EVERY QUESTION FIRST"); return; }
    quizState.checked = true;
    const score = quizState.answers.filter((a, i) => a === l.quiz[i].c).length;
    const p = progress[l.id] || {};
    p.best = Math.max(p.best || 0, score);
    const justPassed = !p.passed && score >= PASS_MARK(lessonIndex(l.id));
    if(score >= PASS_MARK(lessonIndex(l.id))) p.passed = true;
    progress[l.id] = p;
    store.set("progress", progress);
    render();
    if(justPassed) toast("SHEET STAMPED — NEXT LESSON UNLOCKED");
  });

  const retry = $("#quiz-retry", main);
  if(retry) retry.addEventListener("click", () => { quizState = null; render(); });

  const chT = $("#ch-toggle", main);
  if(chT) chT.addEventListener("click", () => {
    const p = progress[view.id] || {};
    p.challenge = !p.challenge;
    progress[view.id] = p;
    store.set("progress", progress);
    render();
  });

  const pjT = $("#proj-toggle", main);
  if(pjT) pjT.addEventListener("click", () => {
    projDone[view.id] = !projDone[view.id];
    store.set("projects", projDone);
    render();
  });

  const bkB = $("#bk-btn", main);
  if(bkB) bkB.addEventListener("click", () => {
    const i = bookmarks.indexOf(view.id);
    if(i >= 0) bookmarks.splice(i, 1); else bookmarks.push(view.id);
    store.set("bookmarks", bookmarks);
    render();
  });

  const na = $("#notes-area", main);
  if(na) na.addEventListener("input", () => {
    notes[view.id] = na.value;
    store.set("notes", notes);
  });

  const rst = $("#reset-btn", main);
  if(rst) rst.addEventListener("click", () => {
    if(confirm("Erase all progress, notes and bookmarks on this device?")){
      progress = {}; bookmarks = []; notes = {}; projDone = {};
      ["progress","bookmarks","notes","projects","view"].forEach(k => localStorage.removeItem("foundry." + k));
      view = {type:"dash"};
      render();
      toast("REGISTER CLEARED — FRESH SHEET");
    }
  });
}

/* ---------- global chrome ---------- */
$("#theme-btn").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  store.set("theme", t);
});
$("#dash-btn").addEventListener("click", () => go({type:"dash"}));
$("#menu-btn").addEventListener("click", () => $("#sidebar").classList.toggle("open"));
$("#search").addEventListener("input", () => renderNav($("#search").value));
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#search") && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT"){
    e.preventDefault(); $("#search").focus();
  }
});

/* ---------- boot ---------- */
document.documentElement.dataset.theme = store.get("theme", "dark");
if(view.type === "lesson" && !isUnlocked(lessonIndex(view.id))) view = {type:"dash"};
render();
</script>
</body>
</html>
