<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tracker</title>
  <meta name="description" content="Personal tracker for projects, exams, practice tests and skills.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = JSON.parse(localStorage.getItem('tracker-theme') || '"system"');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar no-print">
    <a class="brand" href="#/" aria-label="Tracker home"><img class="brand-mark" src="icon.svg" alt="" width="22" height="22"> Tracker</a>
    <nav aria-label="Main">
      <ul class="nav">
        <li><a data-nav href="#/">Dashboard</a></li>
        <li><a data-nav href="#/projects">Projects</a></li>
        <li><a data-nav href="#/exams" data-also="/subjects">Exams</a></li>
        <li><a data-nav href="#/tests" data-also="/attempts">Practice Tests</a></li>
        <li><a data-nav href="#/skills">Skills</a></li>
        <li><a data-nav href="#/settings">Settings</a></li>
      </ul>
    </nav>
  </header>
  <main id="app" tabindex="-1"><p class="loading">Loading…</p></main>
  <div id="toasts" class="toasts no-print" aria-live="polite"></div>
  <noscript><p class="card">This tracker needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
