<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tracker</title>
  <meta name="description" content="Personal tracker and study hub for projects, exams, practice tests and skills.">
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/study.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = JSON.parse(localStorage.getItem('tracker-theme') || '"system"');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div class="shell">
    <aside class="sidebar no-print" aria-label="Sidebar">
      <a class="brand" href="#/" aria-label="Tracker home"><img class="brand-mark" src="icon.svg" alt="" width="28" height="28"><span>Tracker</span></a>
      <nav aria-label="Main">
        <ul class="side-nav" id="side-nav"></ul>
      </nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main-col">
      <header class="topbar no-print">
        <a class="brand brand-mobile" href="#/" aria-label="Tracker home"><img class="brand-mark" src="icon.svg" alt="" width="26" height="26"><span>Tracker</span></a>
        <button class="search-btn" id="search-btn" type="button" aria-label="Search and commands (Ctrl+K)"></button>
        <div class="top-actions">
          <button class="timer-chip" id="timer-chip" type="button"></button>
          <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode"></button>
        </div>
      </header>
      <main id="app" tabindex="-1"><p class="loading">Loading…</p></main>
    </div>
  </div>
  <nav class="bottombar no-print" aria-label="Main (mobile)" id="bottombar"></nav>
  <button class="fab-ai no-print" id="fab-ai" type="button" aria-label="Ask AI"></button>
  <div id="toasts" class="toasts no-print" aria-live="polite"></div>
  <noscript><p class="card">This tracker needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
