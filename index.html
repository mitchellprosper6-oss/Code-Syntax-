<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNTAX REGISTER — Python · C++ · C Reference</title>
<style>
:root{
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"]{
  --bg:#0C121B; --panel:#151F2E; --panel2:#1A2536;
  --line:#26374F; --line2:#31445F;
  --ink:#D9E2EE; --muted:#8CA0BA; --faint:#5D7189;
  --blue:#7FB3E3; --blue-dim:#4A78A8; --ochre:#D9A441;
  --green:#7CC08A; --red:#E08A8A; --code-bg:#0A0F17;
  --kw:#7FB3E3; --str:#D9A441; --com:#5D7189; --num:#7CC08A; --fn:#C7A8E8;
  --grid: rgba(127,179,227,.04);
}
html[data-theme="light"]{
  --bg:#E9EDF1; --panel:#F5F7F9; --panel2:#EDF1F5;
  --line:#B9C7D6; --line2:#A6B7C9;
  --ink:#1D2A3B; --muted:#4E6076; --faint:#7C8DA1;
  --blue:#2E6398; --blue-dim:#5F87AD; --ochre:#A8730F;
  --green:#2F7A42; --red:#A83A3A; --code-bg:#F0F3F6;
  --kw:#2E6398; --str:#A8730F; --com:#7C8DA1; --num:#2F7A42; --fn:#6E3FA0;
  --grid: rgba(46,99,152,.055);
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ---- navbar ---- */
#topbar{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line2); padding:0 clamp(12px,3vw,32px);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
#brand{font-family:var(--font-mono); font-size:14px; letter-spacing:.14em; padding:13px 0; color:var(--ink); white-space:nowrap}
#brand span{color:var(--ochre)}
#navlinks{display:flex; flex-wrap:wrap; gap:2px; flex:1}
#navlinks button{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
  background:none; border:none; border-bottom:2px solid transparent;
  color:var(--muted); padding:14px 9px 12px; cursor:pointer;
}
#navlinks button:hover{color:var(--ink)}
#navlinks button.on{color:var(--ochre); border-bottom-color:var(--ochre)}
#theme-btn, #key-btn{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
  background:var(--panel); border:1px solid var(--line); color:var(--muted);
  padding:6px 10px; border-radius:3px; cursor:pointer;
}
#theme-btn:hover, #key-btn:hover{color:var(--ink); border-color:var(--blue-dim)}
#key-btn.set{color:var(--green); border-color:var(--green)}
button:focus-visible, summary:focus-visible, textarea:focus-visible{outline:2px solid var(--ochre); outline-offset:2px}

#page{max-width:1060px; margin:0 auto; padding:30px clamp(14px,3vw,36px) 90px}

/* ---- typography ---- */
h1{font-size:26px; font-weight:750; letter-spacing:-.015em; margin-bottom:6px}
.sub{font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; color:var(--faint); margin-bottom:26px}
h2.cat{font-size:13px; font-family:var(--font-mono); letter-spacing:.14em; color:var(--blue); margin:0}
p.lede{color:var(--muted); font-size:16px; max-width:70ch; margin-bottom:22px}

/* ---- collapsible category ---- */
details.cat{border:1px solid var(--line2); border-radius:4px; background:var(--panel); margin-bottom:10px}
details.cat > summary{
  list-style:none; cursor:pointer; padding:12px 16px; display:flex;
  align-items:center; gap:12px; user-select:none;
}
details.cat > summary::-webkit-details-marker{display:none}
details.cat > summary .tick{font-family:var(--font-mono); color:var(--ochre); font-size:11px; transition:transform .15s}
details.cat[open] > summary .tick{transform:rotate(90deg)}
details.cat > summary .cnt{margin-left:auto; font-family:var(--font-mono); font-size:10px; color:var(--faint); letter-spacing:.12em}
details.cat > .cat-body{border-top:1px solid var(--line2); padding:16px}

/* ---- syntax entry card ---- */
.entry{padding:14px 0}
.entry + .entry{border-top:1px dashed var(--line)}
.entry .e-name{font-weight:700; font-size:15px; margin-bottom:6px}
.entry .e-name .syn{font-family:var(--font-mono); font-size:12.5px; color:var(--ochre); font-weight:400; margin-left:10px}
.entry .e-what{color:var(--muted); font-size:13.5px; margin-bottom:10px; max-width:75ch}
.meta{font-size:12.5px; margin-top:8px; padding-left:10px; border-left:2px solid var(--line2)}
.meta b{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em; color:var(--blue); display:inline-block; margin-right:6px}
.meta.warn b{color:var(--red)}
.meta{color:var(--muted)}

/* ---- code ---- */
.code{border:1px solid var(--line2); border-radius:4px; overflow:hidden; margin:6px 0}
.code .chead{display:flex; align-items:center; background:var(--panel2); border-bottom:1px solid var(--line2)}
.code .chead .lab{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em; color:var(--faint); padding:6px 12px}
.code .chead .cp{margin-left:auto; background:none; border:none; color:var(--muted); font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; padding:6px 10px; cursor:pointer}
.code .chead .cp:hover{color:var(--ochre)}
.code pre{background:var(--code-bg); padding:11px 14px; overflow-x:auto; font-family:var(--font-mono); font-size:12.5px; line-height:1.6; tab-size:4}
code{font-family:var(--font-mono); font-size:.9em; background:var(--code-bg); border:1px solid var(--line); padding:0 5px; border-radius:3px; color:var(--blue)}
.code pre code{background:none; border:none; padding:0; color:var(--ink)}
.tok-kw{color:var(--kw)} .tok-str{color:var(--str)} .tok-com{color:var(--com); font-style:italic}
.tok-num{color:var(--num)} .tok-fn{color:var(--fn)} .tok-pre{color:var(--ochre)}

/* ---- home cards ---- */
.homegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:8px}
.homecard{
  border:1px solid var(--line2); border-radius:4px; background:var(--panel);
  padding:18px; text-align:left; cursor:pointer; font-family:var(--font-body);
  transition:border-color .15s, transform .15s;
}
.homecard:hover{border-color:var(--ochre); transform:translateY(-2px)}
.homecard .hc-k{font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; color:var(--ochre); margin-bottom:8px}
.homecard .hc-t{font-size:17px; font-weight:700; color:var(--ink); margin-bottom:6px}
.homecard .hc-d{font-size:13px; color:var(--muted); line-height:1.55}

/* ---- tables ---- */
table.cmp{width:100%; border-collapse:collapse; margin-bottom:26px; font-size:13px}
table.cmp th{font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line2)}
table.cmp td{border-bottom:1px solid var(--line); padding:10px; vertical-align:top; width:33.33%}
table.cmp td pre{font-family:var(--font-mono); font-size:12px; line-height:1.55; white-space:pre-wrap; word-break:break-word}
.cmp-topic{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--ochre); padding:14px 0 6px}

/* ---- mistakes ---- */
.mk{border:1px solid var(--line2); border-radius:4px; background:var(--panel); margin-bottom:12px; padding:14px 16px}
.mk .mk-t{font-weight:700; margin-bottom:8px}
.mk-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mk .bad .lab{color:var(--red)} .mk .good .lab{color:var(--green)}
.mk .why{font-size:13px; color:var(--muted); margin-top:8px}
.mk .tip{font-size:12.5px; margin-top:6px; padding-left:10px; border-left:2px solid var(--ochre)}
.mk .tip b{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em; color:var(--ochre)}
@media (max-width:720px){.mk-grid{grid-template-columns:1fr}}

/* ---- flashcards ---- */
.fc-wrap{max-width:640px; margin:0 auto; text-align:center}
.fc-filter{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:18px}
.fc-filter button{font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; background:var(--panel); border:1px solid var(--line); color:var(--muted); padding:6px 10px; border-radius:99px; cursor:pointer}
.fc-filter button.on{border-color:var(--ochre); color:var(--ochre)}
.fcard{
  border:1px solid var(--line2); border-radius:6px; background:var(--panel);
  min-height:280px; padding:26px; cursor:pointer; display:flex; flex-direction:column;
  justify-content:center; align-items:center; gap:14px; position:relative;
}
.fcard .side-lab{position:absolute; top:12px; left:16px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.2em; color:var(--faint)}
.fcard .lang-lab{position:absolute; top:12px; right:16px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.2em; color:var(--ochre)}
.fcard .front-q{font-size:19px; font-weight:650; max-width:44ch}
.fcard .hint{font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; color:var(--faint); position:absolute; bottom:14px}
.fcard .code{width:100%; text-align:left; cursor:auto}
.fc-nav{display:flex; gap:10px; justify-content:center; align-items:center; margin-top:16px}
.fc-nav .pos{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--muted); min-width:80px}

/* ---- quiz / recall ---- */
.btn{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; background:var(--panel); color:var(--muted); border:1px solid var(--line); padding:8px 14px; border-radius:3px; cursor:pointer}
.btn:hover{border-color:var(--blue-dim); color:var(--ink)}
.btn.primary{background:var(--blue-dim); border-color:var(--blue-dim); color:#fff}
html[data-theme="light"] .btn.primary{background:var(--blue); border-color:var(--blue)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.qz-tabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap}
.qz{border:1px solid var(--line2); border-radius:4px; background:var(--panel); margin-bottom:12px; padding:14px 16px}
.qz .qz-q{font-weight:650; margin-bottom:10px}
.qz .qz-q .qn{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em; color:var(--ochre); display:block; margin-bottom:4px}
.qz-opts{display:grid; gap:6px}
.qz-opt{text-align:left; font-family:var(--font-mono); font-size:12.5px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); padding:8px 12px; border-radius:3px; cursor:pointer}
.qz-opt.sel{border-color:var(--blue); color:var(--ink)}
.qz-opt.right{border-color:var(--green); color:var(--green)}
.qz-opt.wrong{border-color:var(--red); color:var(--red)}
.qz-opt:disabled{cursor:default; opacity:1}
.qz .why{display:none; font-size:12.5px; color:var(--muted); margin-top:8px; padding-left:10px; border-left:2px solid var(--line2)}
.qz .why.show{display:block}
.score-stamp{font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; border:2px solid var(--ochre); color:var(--ochre); padding:7px 14px; border-radius:2px; display:inline-block; transform:rotate(-3deg)}
.score-stamp.good{border-color:var(--green); color:var(--green)}
.rc{border:1px solid var(--line2); border-radius:4px; background:var(--panel); margin-bottom:14px; padding:16px}
.rc .rc-q{font-weight:650; margin-bottom:4px}
.rc .rc-q .qn{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em; color:var(--ochre); margin-right:8px}
.rc textarea{
  width:100%; min-height:90px; resize:vertical; margin:10px 0;
  font-family:var(--font-mono); font-size:12.5px; line-height:1.6;
  background:var(--code-bg); color:var(--ink); border:1px solid var(--line2);
  border-radius:3px; padding:10px 12px;
}
.rc .answer{display:none; margin-top:10px}
.rc .answer.show{display:block}
.foot-note{font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:var(--faint); margin-top:40px; text-align:center}
.ai-status{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--ochre); border:1px dashed var(--line2); border-radius:3px; padding:8px 12px; margin:10px 0}
kbd{font-family:var(--font-mono); font-size:.85em; border:1px solid var(--line2); border-bottom-width:2px; border-radius:3px; padding:0 5px; background:var(--panel2)}
</style>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* syntax highlighter */
const KW = {
  python:"def return if elif else for while in not and or is None True False import from as class try except finally with pass break continue lambda global nonlocal print input range len match case raise assert del yield self",
  c:"int char float double void long short unsigned signed if else for while do return break continue switch case default struct typedef sizeof const static enum union goto extern volatile register",
  cpp:"int char float double void long short unsigned signed bool if else for while do return break continue switch case default struct class public private protected new delete const static virtual override template typename namespace using try catch throw this nullptr true false auto enum union sizeof std string vector cout cin endl"
};
function hl(code, lang){
  /* Tokens are stashed in a bank and replaced by control-char
     placeholders (uppercase letters between \u0001..\u0002) that no
     later regex pass can match — fixes markup self-corruption. */
  const bank = [];
  const AZ = n => { let t=""; n++; while(n>0){ n--; t=String.fromCharCode(65+(n%26))+t; n=Math.floor(n/26); } return t; };
  const stash = (m, cls) => { bank.push('<span class="'+cls+'">'+m+'</span>'); return "\u0001"+AZ(bank.length-1)+"\u0002"; };
  let s = esc(code);
  /* protect strings, comments, preprocessor lines first */
  s = s.replace(/(&quot;|")(?:\\.|(?!\1)[^\\\n])*\1|'(?:\\.|[^'\\\n])*'/g, m => stash(m, "tok-str"));
  if(lang==="python"){
    s = s.replace(/#[^\n]*/g, m => stash(m, "tok-com"));
  } else {
    s = s.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, m => stash(m, "tok-com"));
    s = s.replace(/^[ \t]*#\s*\w+[^\n]*/gm, m => stash(m, "tok-pre"));
  }
  /* mark keywords / calls / numbers with control chars only —
     no HTML exists in the string until the very end */
  const words = (KW[lang]||KW.c).split(" ").join("|");
  s = s.replace(new RegExp("\\b("+words+")\\b","g"), "\u0003$1\u0004");
  s = s.replace(/\b([a-zA-Z_]\w*)(\s*\()/g, "\u0005$1\u0004$2");
  s = s.replace(/\b(0[xX][0-9a-fA-F]+|\d+\.?\d*(?:[eE][+-]?\d+)?[fFuUlL]*)\b/g, "\u0006$1\u0004");
  s = s.replace(/\u0003/g,'<span class="tok-kw">')
       .replace(/\u0005/g,'<span class="tok-fn">')
       .replace(/\u0006/g,'<span class="tok-num">')
       .replace(/\u0004/g,'</span>');
  /* restore stashed tokens; loop handles nesting (a string inside a comment) */
  let prev;
  do {
    prev = s;
    s = s.replace(/\u0001([A-Z]+)\u0002/g, (m, az) => {
      let n = 0;
      for(const ch of az) n = n*26 + (ch.charCodeAt(0) - 64);
      return bank[n-1] !== undefined ? bank[n-1] : m;
    });
  } while(s !== prev);
  return s;
}
const LANG_NAME = {python:"PYTHON", cpp:"C++", c:"C", none:"TEXT"};
function codeBlk(lang, src, label){
  return '<div class="code"><div class="chead"><span class="lab">'+(label||LANG_NAME[lang]||"")+'</span>'+
    '<button class="cp" data-raw="'+encodeURIComponent(src)+'">COPY ⧉</button></div>'+
    '<pre><code>'+(lang==="none"?esc(src):hl(src,lang))+'</code></pre></div>';
}
</script>
<script>
"use strict";
/* ============================================================
   PYTHON SYNTAX REFERENCE
   entry: n name · s syntax signature · x explanation ·
          e example code · t note · m common mistake
   ============================================================ */
const REF = {};

REF.python = [
{cat:"Program Structure", items:[
{n:"Minimal program", s:"statements top to bottom", x:"A .py file is executed line by line — no required entry point.",
e:`print("hello")   # a complete program`,
t:"Run with: python3 file.py"},
{n:"Script entry guard", s:"if __name__ == \"__main__\":", x:"Code under the guard runs only when the file is executed directly, not when imported.",
e:`def main():
    print("run")

if __name__ == "__main__":
    main()`,
m:"Writing __name__ == \"main\" (missing underscores) — the block silently never runs."}
]},
{cat:"Comments", items:[
{n:"Line comment", s:"# text", x:"Everything after # to end of line is ignored.",
e:`total = 0  # running sum`},
{n:"Docstring", s:'"""text"""', x:"A string as the first statement of a module/function/class; used as documentation.",
e:`def area(w, h):
    """Return w x h rectangle area."""
    return w * h`,
t:"Not a comment technically — it is a real string, readable via help()."}
]},
{cat:"Variables", items:[
{n:"Assignment", s:"name = value", x:"Creates the name on first assignment; no declaration or type keyword.",
e:`count = 3
count = count + 1
price, qty = 4.5, 2     # multiple at once
a, b = b, a             # swap`,
m:"Using a name before assigning it: NameError."},
{n:"Augmented assignment", s:"x += 1", x:"Shorthand for x = x + 1. Also -= *= /= //= %= **=.",
e:`total += price * qty`,
t:"No ++ or -- in Python."}
]},
{cat:"Constants", items:[
{n:"Convention constant", s:"UPPER_SNAKE = value", x:"Python has no enforced constants; all-caps names signal 'do not reassign'.",
e:`MAX_RETRIES = 3
TAX_RATE = 0.20`,
m:"Assuming the language stops reassignment — it doesn't; only convention does."}
]},
{cat:"Data Types", items:[
{n:"Core types", s:"int float str bool None", x:"Types belong to values, not names (dynamic typing).",
e:`n = 42            # int (unlimited size)
pi = 3.14         # float
name = "Sefe"     # str
ok = True         # bool
missing = None    # absence of a value
print(type(n))    # <class 'int'>`},
{n:"Conversion", s:"int(x) float(x) str(x) bool(x)", x:"Explicit casts between types.",
e:`n = int("42")      # str -> int
s = str(3.14)      # -> "3.14"
i = int(9.99)      # 9 (truncates)`,
m:"int('3.5') raises ValueError — go via float() first."}
]},
{cat:"Strings", items:[
{n:"Literals & f-strings", s:'f"{expr}"', x:"Quotes make strings; f-strings interpolate expressions with format specs after a colon.",
e:`name = "Taff"
s = f"site {name}, depth {12.4:.1f}"
multi = """spans
lines"""`,
t:"Format specs: {x:.2f} {x:>8} {x:04d} {x:.1%}"},
{n:"Index & slice", s:"s[i]  s[a:b]  s[a:b:step]", x:"0-based indexing; slices include start, exclude stop; negatives count from the end.",
e:`s = "register"
s[0]      # 'r'
s[-1]     # 'r'
s[0:3]    # 'reg'
s[::-1]   # reversed`,
m:"s[len(s)] is IndexError — last char is s[-1]."},
{n:"Key methods", s:"s.method()", x:"Strings are immutable — every method returns a NEW string.",
e:`s.upper()  s.lower()  s.strip()
s.replace("a", "b")
s.split(",")          # -> list
",".join(items)       # list -> str
s.find("x")           # index or -1
s.startswith("re")    # bool
"eg" in s             # membership`,
m:"Calling s.upper() without capturing the result: s = s.upper()"}
]},
{cat:"Lists", items:[
{n:"Create & modify", s:"[a, b, c]", x:"Ordered, mutable sequence of anything.",
e:`xs = [3, 1, 2]
xs.append(4)        # add to end
xs.insert(0, 9)     # add at index
xs.remove(1)        # first matching VALUE
last = xs.pop()     # remove+return end
xs.sort()           # in place
xs[0] = 99          # replace
len(xs); 2 in xs`,
m:"ys = xs copies the reference, not the list — use ys = xs[:] or list(xs)."},
{n:"Comprehension", s:"[expr for x in seq if cond]", x:"Build a list from a loop in one expression.",
e:`squares = [n*n for n in range(6)]
evens = [n for n in nums if n % 2 == 0]`}
]},
{cat:"Tuples", items:[
{n:"Tuple", s:"(a, b)", x:"Ordered and immutable — a fixed record. Unpacks into names.",
e:`pt = (51.48, -3.18)
lat, lon = pt          # unpacking
one = (5,)             # 1-tuple NEEDS the comma`,
t:"Immutability makes tuples valid dict keys.",
m:"(5) is just the number 5 in brackets — (5,) is the tuple."}
]},
{cat:"Dictionaries", items:[
{n:"Dict", s:"{key: value}", x:"Key → value lookup; keys must be immutable; keeps insertion order.",
e:`d = {"PB": 12.4, "TC": 7.8}
d["SW"] = 5.5          # add / overwrite
d["PB"]                # lookup (KeyError if absent)
d.get("EL", 0.0)       # safe lookup with default
del d["TC"]
for k, v in d.items():
    print(k, v)

<script>
"use strict";
/* ============================================================
   AI EXPANSION — "generate new" buttons on Flashcards, Quizzes
   and Recall. Calls Claude to produce items not already in the
   banks. Additions are session-only (reload discards them),
   consistent with the no-storage design.
   NOTE: works when this page is open inside Claude (the keyless
   API is provided there). Opened as a plain offline file, the
   button fails gracefully with a message.
   ============================================================ */
let aiBusy = false;
const aiMsg = {cards:"", quiz:"", recall:""};

const aiNorm = s => String(s).toLowerCase().replace(/\s+/g, " ").trim();

function getApiKey(){
  try{ return localStorage.getItem("register.apikey") || ""; }catch(e){ return ""; }
}
async function callClaude(prompt){
  /* Inside Claude the API is keyless. Everywhere else (GitHub Pages,
     local file) a personal Anthropic API key set via the AI KEY
     button is sent with the browser-access headers. */
  const headers = {"Content-Type": "application/json"};
  const key = getApiKey();
  if(key){
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: headers,
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{role: "user", content: prompt}]
    })
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  const a = clean.indexOf("["), b = clean.lastIndexOf("]");
  if(a < 0 || b < 0) throw new Error("no JSON in reply");
  return JSON.parse(clean.slice(a, b + 1));
}

const LANG_OK = {python:1, cpp:1, c:1};

async function aiGenerate(kind, btn){
  if(aiBusy) return;
  aiBusy = true;
  btn.disabled = true;
  btn.textContent = "GENERATING…";
  try{
    let added = 0;

    if(kind === "cards"){
      const groups = [...new Set(CARDS.map(c => c.g))];
      const existing = CARDS.map(c => c.f);
      const items = await callClaude(
        "You are adding flashcards to a syntax-memorisation reference for Python, C++ and C.\n" +
        "Respond with ONLY a JSON array — no prose, no markdown fences.\n" +
        "Each item: {\"g\": group name, \"l\": \"python\" or \"cpp\" or \"c\", \"f\": a short 'write the syntax for X' style prompt, \"a\": the answer as plain code with \\n newlines}.\n" +
        "Choose groups from: " + JSON.stringify(groups) + "\n" +
        "Generate exactly 6 NEW cards about syntax constructs NOT covered by any of these existing prompts:\n" +
        JSON.stringify(existing));
      const seen = new Set(CARDS.map(c => aiNorm(c.f)));
      for(const it of items){
        if(!it || !it.g || !LANG_OK[it.l] || !it.f || !it.a) continue;
        if(seen.has(aiNorm(it.f))) continue;
        seen.add(aiNorm(it.f));
        CARDS.push({g:String(it.g), l:it.l, f:String(it.f), a:String(it.a), fresh:true});
        added++;
      }
      if(added){
        const deck = fcState.group === "All" ? CARDS : CARDS.filter(c => c.g === fcState.group);
        fcState.i = Math.max(0, deck.length - 1);
        fcState.back = false;
      }
      aiMsg.cards = added
        ? "✚ " + added + " new cards added and queued at the end of the deck — this session only (reload discards)"
        : "The model returned nothing usable — try again.";
    }

    if(kind === "quiz"){
      const lang = qzState.lang;
      const existing = QUIZZES[lang].map(q => q.q);
      const items = await callClaude(
        "You are adding multiple-choice questions to a " + LANG_NAME[lang] + " syntax quiz for beginners memorising syntax.\n" +
        "Respond with ONLY a JSON array — no prose, no markdown fences.\n" +
        "Each item: {\"q\": the question, \"a\": array of exactly 4 short answer options, \"c\": index 0-3 of the correct option, \"why\": one-sentence explanation of the correct answer}.\n" +
        "Questions must be about " + LANG_NAME[lang] + " syntax/behaviour only, factually correct, with exactly one right option.\n" +
        "Generate exactly 6 NEW questions covering ground NOT in this existing list:\n" +
        JSON.stringify(existing));
      const seen = new Set(QUIZZES[lang].map(q => aiNorm(q.q)));
      for(const it of items){
        if(!it || !it.q || !Array.isArray(it.a) || it.a.length !== 4) continue;
        const c = Number(it.c);
        if(!(c >= 0 && c <= 3) || !it.why) continue;
        if(seen.has(aiNorm(it.q))) continue;
        seen.add(aiNorm(it.q));
        QUIZZES[lang].push({q:String(it.q), a:it.a.map(String), c:c, why:String(it.why), fresh:true});
        added++;
      }
      if(added) qzState = {lang:lang, answers:{}, submitted:false};   // fresh sheet incl. new questions
      aiMsg.quiz = added
        ? "✚ " + added + " new " + LANG_NAME[lang] + " questions added (answers cleared to include them) — this session only"
        : "The model returned nothing usable — try again.";
    }

    if(kind === "recall"){
      const existing = RECALL.map(r => r.q);
      const items = await callClaude(
        "You are adding recall exercises to a syntax-memorisation site for Python, C++ and C.\n" +
        "Respond with ONLY a JSON array — no prose, no markdown fences.\n" +
        "Each item: {\"l\": \"python\" or \"cpp\" or \"c\", \"q\": a 'write this from memory' prompt for one small syntax construct, \"a\": the reference answer as plain code with \\n newlines}.\n" +
        "Generate exactly 4 NEW exercises about constructs NOT covered by any of these existing prompts:\n" +
        JSON.stringify(existing));
      const seen = new Set(RECALL.map(r => aiNorm(r.q)));
      for(const it of items){
        if(!it || !LANG_OK[it.l] || !it.q || !it.a) continue;
        if(seen.has(aiNorm(it.q))) continue;
        seen.add(aiNorm(it.q));
        RECALL.push({l:it.l, q:String(it.q), a:String(it.a), fresh:true});
        added++;
      }
      aiMsg.recall = added
        ? "✚ " + added + " new exercises appended at the bottom — this session only (reload discards)"
        : "The model returned nothing usable — try again.";
    }
  }catch(e){
    aiMsg[kind] = "GENERATION FAILED (" + e.message + ") — " +
      (getApiKey()
        ? "check your API key (AI KEY button, top right), your connection, and your Anthropic account credit."
        : "outside Claude this needs your own Anthropic API key: click AI KEY in the top bar to set one (stored only in this browser).");
  }finally{
    aiBusy = false;
    render();
  }
}

function aiStatusHTML(kind){
  return aiMsg[kind] ? '<div class="ai-status">' + esc(aiMsg[kind]) + '</div>' : "";
}
</script>

<script>
"use strict";
/* ============================================================
   PAGE ENGINE — simple hash router, no storage of any kind
   (theme preference is the single exception, cosmetic only)
   ============================================================ */
const PAGES = [
["home","HOME"],["python","PYTHON"],["cpp","C++"],["c","C"],
["structure","STRUCTURE"],["compare","COMPARE"],["mistakes","MISTAKES"],
["flashcards","FLASHCARDS"],["quizzes","QUIZZES"],["recall","RECALL"]
];

/* per-page session state (resets on reload — by design) */
let fcState = {i:0, back:false, group:"All"};
let qzState = {lang:"python", answers:{}, submitted:false};
let currentPage = "home";

/* ---------- shared renderers ---------- */
function entryHTML(it, lang){
  let h = '<div class="entry"><div class="e-name">' + it.n + (it.s ? '<span class="syn">' + esc(it.s) + '</span>' : '') + '</div>';
  h += '<div class="e-what">' + it.x + '</div>';
  if(it.e) h += codeBlk(lang, it.e, "EXAMPLE");
  if(it.t) h += '<div class="meta"><b>NOTE</b>' + it.t + '</div>';
  if(it.m) h += '<div class="meta warn"><b>COMMON MISTAKE</b>' + it.m + '</div>';
  h += '</div>';
  return h;
}

function refPage(lang, title){
  let h = '<h1>' + title + ' syntax</h1><div class="sub">REFERENCE REGISTER — ' + REF[lang].reduce((n,c)=>n+c.items.length,0) + ' ENTRIES · CLICK A CATEGORY TO OPEN</div>';
  h += '<p style="margin-bottom:14px"><button class="btn" id="open-all">OPEN ALL</button> <button class="btn" id="close-all">CLOSE ALL</button></p>';
  REF[lang].forEach(cat => {
    h += '<details class="cat"><summary><span class="tick">▸</span><h2 class="cat">' + cat.cat.toUpperCase() + '</h2><span class="cnt">' + cat.items.length + '</span></summary><div class="cat-body">';
    cat.items.forEach(it => { h += entryHTML(it, lang); });
    h += '</div></details>';
  });
  return h;
}

/* ---------- pages ---------- */
function pageHome(){
  const cards = [
    ["python","01","Python syntax","Every construct from variables to classes: signature, example, notes, classic mistakes."],
    ["cpp","02","C++ syntax","From includes and vectors to virtual, templates and smart pointers."],
    ["c","03","C syntax","Pointers, structs, malloc, the preprocessor — the bare-metal register."],
    ["structure","04","Code structure","Whole-program templates side by side: hello world to header/source layout."],
    ["compare","05","Language comparison","The same construct in all three languages, one table per topic."],
    ["mistakes","06","Common mistakes","Wrong vs right, why it breaks, and a hook for remembering the fix."],
    ["fc","07","Flashcards","Prompt on the front, syntax on the back. Flip, next, repeat."],

  STRUCTURES.forEach(st => {
    h += '<details class="cat" open><summary><span class="tick">▸</span><h2 class="cat">' + st.t.toUpperCase() + '</h2></summary><div class="cat-body">';

function pageFlashcards(){
  const groups = ["All", ...new Set(CARDS.map(c => c.g))];
  const deck = fcState.group === "All" ? CARDS : CARDS.filter(c => c.g === fcState.group);
  if(fcState.i >= deck.length) fcState.i = 0;

function pageQuizzes(){

  h += '<div class="qz-tabs">';
  [["python","PYTHON"],["cpp","C++"],["c","C"]].forEach(([l, name]) => {

  h += '<button class="btn" id="ai-quiz" style="margin-left:auto">✚ AI: GENERATE 6 NEW QUESTIONS</button>';
  h += '</div>';
  h += aiStatusHTML("quiz");

  qs.forEach((q, qi) => {
    h += '<div class="qz"><div class="qz-q"><span class="qn">Q' + String(qi+1).padStart(2,"0") + (q.fresh ? " · NEW" : "") + '</span>' + esc(q.q) + '</div><div class="qz-opts">';
    q.a.forEach((opt, oi) => {
      let cls = "qz-opt";
      if(qzState.submitted){
        if(oi === q.c) cls += " right";
        else if(qzState.answers[qi] === oi) cls += " wrong";
      } else if(qzState.answers[qi] === oi) cls += " sel";
      h += '<button class="' + cls + '" data-q="' + qi + '" data-o="' + oi + '" ' + (qzState.submitted ? "disabled" : "") + '>' + esc(opt) + '</button>';
    });
    h += '</div><div class="why' + (qzState.submitted ? " show" : "") + '">' + q.why + '</div></div>';
  });

  h += '<div style="display:flex; gap:14px; align-items:center; margin-top:8px">';
  if(!qzState.submitted){
    h += '<button class="btn primary" id="qz-submit">SUBMIT — SHOW SCORE &amp; ANSWERS</button>';
  } else {
    const score = qs.reduce((n, q, i) => n + (qzState.answers[i] === q.c ? 1 : 0), 0);
    h += '<span class="score-stamp' + (score >= Math.ceil(qs.length * 0.8) ? " good" : "") + '">SCORE ' + score + ' / ' + qs.length + '</span>';
    h += '<button class="btn" id="qz-retry">TRY AGAIN</button>';
  }
  h += '</div>';
  return h;
}

function pageRecall(){
  let h = '<h1>Recall exercises</h1><div class="sub">WRITE IT FROM MEMORY FIRST — THEN REVEAL AND COMPARE LINE BY LINE</div>';
  h += '<p class="lede">The scratchpad is just for your attempt; it isn\u2019t checked or saved. The comparison is the exercise: where your version differs, that\u2019s the detail to drill.</p>';
  h += '<p style="margin-bottom:14px"><button class="btn" id="ai-recall">✚ AI: GENERATE 4 NEW EXERCISES</button></p>';
  h += aiStatusHTML("recall");
  RECALL.forEach((r, i) => {
    h += '<div class="rc"><div class="rc-q"><span class="qn">R' + String(i+1).padStart(2,"0") + ' · ' + LANG_NAME[r.l] + (r.fresh ? " · NEW" : "") + '</span>' + esc(r.q) + '</div>';
    h += '<textarea placeholder="Type your attempt here…" spellcheck="false"></textarea>';
    h += '<button class="btn" data-reveal="' + i + '">REVEAL REFERENCE</button>';
    h += '<div class="answer" id="ans-' + i + '">' + codeBlk(r.l, r.a, "REFERENCE") + '</div></div>';
  });
  return h;
}

/* ---------- router & events ---------- */
function renderNavbar(){
  $("#navlinks").innerHTML = PAGES.map(([id, name]) =>
    '<button class="' + (currentPage === id ? "on" : "") + '" data-page="' + id + '">' + name + '</button>'
  ).join("");
  $$("#navlinks button").forEach(b => b.addEventListener("click", () => nav(b.dataset.page)));
}

function nav(page){
  currentPage = page;
  if(location.hash !== "#" + page) location.hash = page;  // real history entry
  render();
  window.scrollTo({top:0});
}

function render(){
  renderNavbar();
  const pg = $("#page");
  const map = {
    home:pageHome,
    python:() => refPage("python","Python"),
    cpp:() => refPage("cpp","C++"),
    c:() => refPage("c","C"),
    structure:pageStructure, compare:pageCompare, mistakes:pageMistakes,
    flashcards:pageFlashcards, quizzes:pageQuizzes, recall:pageRecall
  };
  pg.innerHTML = (map[currentPage] || pageHome)();
  bind(pg);
}

function bind(pg){
  $$(".cp", pg).forEach(b => b.addEventListener("click", () => {
    const raw = decodeURIComponent(b.dataset.raw);
    const done = ok => { b.textContent = ok ? "COPIED ✓" : "COPY FAILED"; setTimeout(() => b.textContent = "COPY ⧉", 1400); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(raw).then(() => done(true), () => done(false));
    } else {
      const ta = document.createElement("textarea");
      ta.value = raw; document.body.appendChild(ta); ta.select();
      let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); done(ok);
    }
  }));

  $$("[data-goto]", pg).forEach(b => b.addEventListener("click", () => nav(b.dataset.goto)));

  const oa = $("#open-all", pg), ca = $("#close-all", pg);
  if(oa) oa.addEventListener("click", () => $$("details.cat", pg).forEach(d => d.open = true));
  if(ca) ca.addEventListener("click", () => $$("details.cat", pg).forEach(d => d.open = false));

  /* flashcards */
  const fc = $("#fcard", pg);
  if(fc){
    const deckLen = (fcState.group === "All" ? CARDS : CARDS.filter(c => c.g === fcState.group)).length;
    const flip = () => { fcState.back = !fcState.back; render(); };
    fc.addEventListener("click", e => { if(!e.target.closest(".cp")) flip(); });
    fc.addEventListener("keydown", e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } });
    $("#fc-next", pg).addEventListener("click", () => { fcState.i = (fcState.i + 1) % deckLen; fcState.back = false; render(); });
    $("#fc-prev", pg).addEventListener("click", () => { fcState.i = (fcState.i - 1 + deckLen) % deckLen; fcState.back = false; render(); });
    $("#fc-shuffle", pg).addEventListener("click", () => { fcState.i = Math.floor(Math.random() * deckLen); fcState.back = false; render(); });
    $$("[data-fcgroup]", pg).forEach(b => b.addEventListener("click", () => {
      fcState = {i:0, back:false, group:b.dataset.fcgroup}; render();
    }));
  }

  /* quizzes */
  $$("[data-qzlang]", pg).forEach(b => b.addEventListener("click", () => {
    qzState = {lang:b.dataset.qzlang, answers:{}, submitted:false}; render();
  }));
  $$(".qz-opt", pg).forEach(b => b.addEventListener("click", () => {
    if(qzState.submitted) return;
    qzState.answers[+b.dataset.q] = +b.dataset.o; render();
  }));
  const sub = $("#qz-submit", pg);
  if(sub) sub.addEventListener("click", () => {
    const qs = QUIZZES[qzState.lang];
    if(Object.keys(qzState.answers).length < qs.length){
      sub.textContent = "ANSWER ALL " + qs.length + " FIRST";
      setTimeout(() => sub.textContent = "SUBMIT — SHOW SCORE & ANSWERS", 1600);
      return;
    }
    qzState.submitted = true; render();
  });
  const rty = $("#qz-retry", pg);
  if(rty) rty.addEventListener("click", () => { qzState = {lang:qzState.lang, answers:{}, submitted:false}; render(); });

  /* AI generation */
  [["#ai-cards","cards"],["#ai-quiz","quiz"],["#ai-recall","recall"]].forEach(([sel, kind]) => {
    const b = $(sel, pg);
    if(b) b.addEventListener("click", () => aiGenerate(kind, b));
  });

  /* recall */
  $$("[data-reveal]", pg).forEach(b => b.addEventListener("click", () => {
    const ans = $("#ans-" + b.dataset.reveal, pg);
    const showing = ans.classList.toggle("show");
    b.textContent = showing ? "HIDE REFERENCE" : "REVEAL REFERENCE";
  }));
}

/* ---------- theme + boot ---------- */
function refreshKeyBtn(){
  const b = $("#key-btn");
  b.classList.toggle("set", !!getApiKey());
  b.textContent = getApiKey() ? "AI KEY ✓" : "AI KEY";
}
$("#key-btn").addEventListener("click", () => {
  const cur = getApiKey();
  const v = prompt(
    "Anthropic API key for the AI generate buttons (sk-ant-...).\n" +
    "Stored ONLY in this browser's localStorage — never sent anywhere except api.anthropic.com.\n" +
    "Leave empty and press OK to clear." + (cur ? "\n\nA key is currently set." : ""),
    "");
  if(v === null) return;                      // cancelled
  try{
    if(v.trim() === "") localStorage.removeItem("register.apikey");
    else localStorage.setItem("register.apikey", v.trim());
  }catch(e){}
  refreshKeyBtn();
});
refreshKeyBtn();

$("#theme-btn").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem("register.theme", t); }catch(e){}
});
try{
  const t = localStorage.getItem("register.theme");
  if(t) document.documentElement.dataset.theme = t;
}catch(e){}

const start = location.hash.replace("#","");
if(PAGES.some(([id]) => id === start)) currentPage = start;
window.addEventListener("hashchange", () => {
  const p = location.hash.replace("#","");
  if(p !== currentPage && PAGES.some(([id]) => id === p)){ currentPage = p; render(); window.scrollTo({top:0}); }
});
render();
</script>
</body>
